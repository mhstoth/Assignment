name: Node.js CI

on:
  push:
    branches: [ "b-master" ]
  pull_request:
    branches: [ "b-master" ]

jobs:
  backend-test:
    name: Backend Test & Audit
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Security Audit
      run: npm audit --audit-level=high

    - name: Run Lint
      run: npm run lint

    - name: Run Tests
      run: npm test
      env:
        DB: mongodb://localhost:27017/test-db
        COOKIE_NAME: placemark-test-cookie
        COOKIE_PASSWORD: secretpasswordforciwhichislongenoughtobasecure32chars
        JWT_PASSWORD: secretpasswordforciwhichislongenoughtobasecure32chars

  frontend-check:
    name: Frontend Check & Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
        
    - name: Install Dependencies
      working-directory: ./client
      run: npm ci
      
    - name: Svelte Check
      working-directory: ./client
      run: npm run check
      
    - name: Run Lint
      working-directory: ./client
      run: npm run lint
      
    - name: Build
      working-directory: ./client
      run: npm run build
